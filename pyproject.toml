[build-system]
requires = ["uv-build>=0.7,<0.8"]
build-backend = "uv_build"

[project]
name = "md-docx"
version = "0.1.0"
description = "Bidirectional converter between .docx and Markdown"
requires-python = ">=3.12"
dependencies = [
    "pypandoc_binary",
    "pypandoc",
    "python-docx>=1.2.0",
    "Pillow>=10.0.0",
]

[project.scripts]
md-docx = "md_docx.main:main"

[dependency-groups]
dev = ["pytest"]