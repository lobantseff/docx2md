[build-system]
requires = ["uv-build>=0.7,<0.8"]
build-backend = "uv_build"

[project]
name = "doc2md"
version = "0.1.2"
description = "Bidirectional converter between .docx and Markdown"
requires-python = ">=3.12"
dependencies = [
    "pypandoc_binary",
    "pypandoc",
    "python-docx>=1.2.0",
    "Pillow>=10.0.0",
]

[project.scripts]
doc2md = "md_docx.main:doc2md"
md2doc = "md_docx.main:md2doc"

[dependency-groups]
dev = ["pytest"]

[tool.uv.build-backend]
module-name = "md_docx"