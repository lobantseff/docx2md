[build-system]
requires = ["uv-build>=0.7,<0.8"]
build-backend = "uv_build"

[project]
name = "doc2md"
version = "0.1.8"
description = "Bidirectional converter between .docx and Markdown"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Artem Lobantsev", email = "lobantseff@gmail.com" }]
requires-python = ">=3.12"
keywords = ["docx", "markdown", "pandoc", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    # pypandoc_binary ships the pypandoc module *and* a bundled pandoc;
    # depending on plain pypandoc as well installs the same files twice.
    "pypandoc_binary",
    "python-docx>=1.2.0",
    "lxml>=5.0.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/lobantseff/docx2md"
Repository = "https://github.com/lobantseff/docx2md"
Issues = "https://github.com/lobantseff/docx2md/issues"

[project.scripts]
doc2md = "md_docx.main:doc2md"
md2doc = "md_docx.main:md2doc"

[dependency-groups]
dev = ["pytest"]

[tool.uv.build-backend]
module-name = "md_docx"